<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>腾讯视频 · Egern</title><style>body{font:16px system-ui;max-width:600px;margin:64px auto;padding:0 24px;background:#10151e;color:#eef2f7}h1{font-size:26px}input{box-sizing:border-box;width:100%;padding:14px;background:#1c2636;border:1px solid #45536a;border-radius:10px;color:inherit;font-size:14px}button{width:100%;padding:15px;margin:14px 0;border:0;border-radius:10px;background:#8ddcc3;color:#10251d;font-size:17px;font-weight:bold;cursor:pointer}a{color:#8ddcc3}li{margin:12px 0}#status{min-height:24px}</style></head><body><h1>腾讯视频净化 · Egern</h1><input id="url" aria-label="模块链接" readonly value="https://raw.githubusercontent.com/m20104600/AD/main/modules/txvideo-ad.egern.yaml"><button id="copy" type="button">复制模块链接</button><p id="status" role="status" aria-live="polite"></p><h2>使用方法</h2><ol><li>Egern → 模块 → + → 从 URL 添加，粘贴模块链接。</li><li>启用模块、HTTPS 解密（MITM），安装并信任 Egern CA 证书。</li><li>关闭重复的腾讯视频重写规则，断开重连 Egern，重新打开腾讯视频。</li></ol><h2>来源</h2><p>原作者：TG@ZenMoFiShi<br>原项目：<a href="https://github.com/ZenmoFeiShi/Qx">ZenmoFeiShi/Qx</a><br><a href="https://github.com/ZenmoFeiShi/Qx/blob/main/TxvideoAD.snippet">原配置</a> · <a href="https://github.com/ZenmoFeiShi/Qx/blob/main/Txvideoad.js">原脚本</a></p><p><a href="https://github.com/m20104600/AD">返回仓库</a></p><script>
const field=document.getElementById('url'),status=document.getElementById('status');
document.getElementById('copy').addEventListener('click',async()=>{let copied=false;try{await navigator.clipboard.writeText(field.value);copied=true;}catch{field.focus();field.select();field.setSelectionRange(0,field.value.length);try{copied=document.execCommand('copy');}catch{}}status.textContent=copied?'已复制，去 Egern 粘贴即可。':'请长按上方链接，选择复制。';});
</script></body></html>
