name: Sync Tencent Video upstream
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: txvideo-upstream-sync
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      revision: ${{ steps.head.outputs.revision }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Resolve upstream HEAD with read-only authentication
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          revision=$(python tools/sync_upstream.py --resolve-only)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
  sync:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - name: Test sync safety gates
        run: python -m unittest discover -s tests -p 'test_sync_*.py'
      - name: Fetch pinned upstream and validate candidate
        env:
          UPSTREAM_REVISION: ${{ needs.resolve.outputs.revision }}
        run: python tools/sync_upstream.py --revision "$UPSTREAM_REVISION"
      - name: Publish validated update
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- upstream/ scripts/txvideo-ad.egern.js; then
            echo 'No upstream changes; nothing to publish.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add upstream/TxvideoAD.snippet upstream/Txvideoad.js upstream/SOURCE.json scripts/txvideo-ad.egern.js
          git diff --cached --check
          git commit -m 'chore: sync validated Tencent Video upstream'
          gh auth setup-git
          git push origin HEAD:main
          local_sha=$(git rev-parse HEAD)
          remote_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          test "$local_sha" = "$remote_sha"
          echo 'updated=true' >> "$GITHUB_OUTPUT"
      - name: Notify Telegram after published update
        if: steps.publish.outputs.updated == 'true'
        continue-on-error: true
        env:
          AD_TG_BOT_TOKEN: ${{ secrets.AD_TG_BOT_TOKEN }}
          AD_TG_CHAT_ID: ${{ secrets.AD_TG_CHAT_ID }}
        run: python tools/notify_update.py
  report:
    needs: [resolve, sync]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Report failure without replacing current release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='上游自动同步失败：需人工检查'
          existing=$(gh issue list --state open --search "$title in:title" --json title --jq '.[].title')
          if [ "$existing" != "$title" ]; then
            gh issue create --title "$title" --body "上游同步或测试失败，未强制覆盖发布版本。请检查运行日志：$RUN_URL"
          fi
