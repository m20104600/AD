name: Sync Tencent Video upstream
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: txvideo-upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - name: Test sync safety gates
        run: python -m unittest discover -s tests -p 'test_sync_*.py'
      - name: Fetch pinned upstream and validate candidate
        run: python tools/sync_upstream.py
      - name: Publish validated update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- upstream/ scripts/txvideo-ad.egern.js; then
            echo 'No upstream changes; nothing to publish.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add upstream/TxvideoAD.snippet upstream/Txvideoad.js upstream/SOURCE.json scripts/txvideo-ad.egern.js
          git diff --cached --check
          git commit -m 'chore: sync validated Tencent Video upstream'
          gh auth setup-git
          git push origin HEAD:main
          local_sha=$(git rev-parse HEAD)
          remote_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          test "$local_sha" = "$remote_sha"
      - name: Report failure without replacing current release
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='上游自动同步失败：需人工检查'
          existing=$(gh issue list --state open --search "$title in:title" --json title --jq '.[].title')
          if [ "$existing" != "$title" ]; then
            gh issue create --title "$title" --body "上游同步或测试失败，未强制覆盖发布版本。请检查运行日志：$RUN_URL"
          fi
