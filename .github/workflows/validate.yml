name: Offline validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/build.py
      - run: git diff --exit-code -- scripts/txvideo-ad.egern.js
      - run: node --check scripts/txvideo-ad.egern.js
      - run: node --test tests/*.test.mjs
      - run: python -m unittest discover -s tests -p 'test_sync_*.py'
      - run: python tests/validate_module.py
